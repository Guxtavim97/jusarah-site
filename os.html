<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c1e3e">
<title>Acompanhe sua aeronave · PJ AERO CENTRO</title>
<link rel="icon" href="/mecanica/icon-192.png">

<base href="/">
<script src="assets/js/supabase.js"></script>
<script>if(!window.supabase){document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script>');}</script>
<script src="assets/js/qr.js"></script>
<style>
  :root{
    --bp:#0a1a33; --bp2:#12294d; --linha:#a6b1c4; --linha2:#8b95a6;
    --blue:#12294d; --green:#2f9e44; --green-d:#1B6E3B; --amber:#c8890a; --ok:#4fe08a;
    --ink:#12212e; --muted:#5b6b78; --line:#e4e9ee; --paper:#f6f8fa; --bg:#eef2f5;
    --mono:'Consolas','SF Mono','Roboto Mono',ui-monospace,monospace;
    --font:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.5;
    overflow-x:hidden}
  img{max-width:100%;display:block}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px 60px}

  /* entrada suave dos blocos */
  .sobe{opacity:0;transform:translateY(22px);animation:sobe .7s cubic-bezier(.16,.84,.44,1) forwards}
  @keyframes sobe{to{opacity:1;transform:none}}
  /* entrada SEM transform — para elementos position:fixed, onde qualquer transform
     desloca (e em alguns navegadores quebra) a fixação na tela */
  .aparece{opacity:0;animation:aparece .6s ease .25s forwards}
  @keyframes aparece{to{opacity:1}}

  /* ===================== HERO: a aeronave se desenha ===================== */
  .hero{position:relative;overflow:hidden;color:#fff;padding:22px 0 0;
    background:
      repeating-linear-gradient(0deg,rgba(127,212,255,.05) 0 1px,transparent 1px 30px),
      repeating-linear-gradient(90deg,rgba(127,212,255,.05) 0 1px,transparent 1px 30px),
      radial-gradient(130% 110% at 50% 0%, var(--bp2) 0%, var(--bp) 65%)}
  .hero__in{max-width:860px;margin:0 auto;padding:0 16px}
  .marca{display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .marca img{width:min(78vw,260px);height:auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
  .lg-papel{display:none}   /* logo colorido: só no papel (o branco some no branco) */
  .marca div{font-weight:800;font-size:.98rem;line-height:1.15}
  .marca small{display:block;font-size:.62rem;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;opacity:.65}

  .id{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .id__pref{font-family:var(--mono);font-size:clamp(2.2rem,9vw,3.2rem);font-weight:700;
    letter-spacing:.04em;line-height:1;text-shadow:0 4px 24px rgba(0,0,0,.4)}
  .id__mod{color:#8fb4d6;font-size:.95rem;margin-bottom:5px}
  .id__os{margin-left:auto;text-align:right;font-family:var(--mono)}
  .id__os small{display:block;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:#6f8db0}
  .id__os b{font-size:1rem;color:#a9c8e6}

  .desenho{position:relative;margin:0 -16px}
  .dw{display:block;width:100%;height:auto}
  .dw .ln{fill:none;stroke:var(--linha);stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;
    stroke-dasharray:var(--L);stroke-dashoffset:var(--L);animation:desenha 2.4s cubic-bezier(.4,0,.2,1) forwards}
  .dw .fina{stroke:var(--linha2);stroke-width:1}
  .dw .eixo{stroke:rgba(127,212,255,.28);stroke-width:1;stroke-dasharray:16 5 3 5;fill:none}
  @keyframes desenha{to{stroke-dashoffset:0}}
  .helice{transform-box:fill-box;transform-origin:center}
  .vivo .helice{animation:gira 1.1s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  .dw .pin{opacity:0;transition:opacity 1.4s ease}
  .vivo .dw .pin{opacity:1}
  .vivo .dw .ln{stroke:rgba(190,225,255,.5)}

  /* ===================== SITUAÇÃO ===================== */
  .sit{position:relative;margin:-6px 0 0;padding:0 0 26px}
  .selo{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:10px 20px;
    font-weight:800;font-size:.95rem;backdrop-filter:blur(6px)}
  .selo .pt{width:9px;height:9px;border-radius:50%;background:currentColor}
  .selo .pt::after{content:"";display:block;width:9px;height:9px;border-radius:50%;
    background:currentColor;animation:onda 2s ease-out infinite}
  @keyframes onda{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
  .s-and{background:rgba(255,196,77,.16);color:#ffd47a;border:1px solid rgba(255,196,77,.4)}
  .s-lib{background:rgba(79,224,138,.16);color:var(--ok);border:1px solid rgba(79,224,138,.45)}
  .agora{margin-top:14px;font-size:1.05rem;line-height:1.5;color:#dce8f5;max-width:560px}
  .agora b{color:#fff}

  /* trilha das etapas */
  .trilha{display:flex;gap:4px;margin-top:20px}
  .trilha i{flex:1;height:6px;border-radius:3px;background:rgba(127,212,255,.16);
    transform:scaleX(0);transform-origin:left;animation:cresce .5s ease forwards}
  @keyframes cresce{to{transform:scaleX(1)}}
  .trilha i.on{background:var(--linha)}
  .trilha i.fim{background:var(--ok)}
  .trilha-l{display:flex;justify-content:space-between;font-size:.72rem;color:#6f8db0;margin-top:8px;
    font-family:var(--mono)}

  /* ===================== CARDS ===================== */
  .card{background:#fff;border-radius:20px;padding:22px 22px;margin-bottom:14px;
    box-shadow:0 10px 30px rgba(18,33,46,.09)}
  .card h2{margin:0 0 16px;font-size:1.02rem;display:flex;align-items:center;gap:9px;letter-spacing:-.01em}
  .card h2 .c{margin-left:auto;font-size:.74rem;font-weight:700;color:var(--muted);
    background:var(--paper);border-radius:999px;padding:3px 10px}

  .sv{display:flex;gap:13px;padding:13px 0;border-bottom:1px solid var(--line)}
  .sv:last-of-type{border:0}
  .sv__ic{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;
    font-size:.82rem;font-weight:800;background:var(--paper);color:#9aa6ae}
  .sv__ic.ok{background:#e9f6ed;color:var(--green-d)}
  .sv__ic.esp{background:#fdf4e3;color:var(--amber)}
  /* detalhe técnico do serviço */
  .sv__meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
  .sv__meta span{font-size:.76rem;color:var(--muted);background:var(--paper);
    border-radius:7px;padding:2px 9px;font-family:var(--mono)}
  /* quem executou · quem conferiu */
  .assin2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
  @media(max-width:440px){ .assin2{grid-template-columns:1fr} }
  .assin2 div{border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff}
  .assin2 div.ok{border-color:#cfe3d3;background:#f6fbf7}
  .assin2 small{display:block;font-size:.62rem;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted)}
  .assin2 b{display:block;font-size:.88rem;line-height:1.25;margin-top:1px}
  .assin2 span{font-size:.72rem;color:var(--muted);font-family:var(--mono)}
  .sv__t{font-weight:600}
  .sv__s{font-size:.83rem;color:var(--muted)}
  .nota{background:var(--paper);border-radius:12px;padding:13px 15px;font-size:.88rem;
    color:var(--muted);margin-top:14px;line-height:1.5}
  .nota b{color:var(--ink)}

  /* ---- tabelas do orçamento ---- */
  table.orc{width:100%;border-collapse:collapse;font-size:.86rem;min-width:440px}
  table.orc th{text-align:left;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);border-bottom:1.5px solid rgba(127,142,160,.35);padding:7px 8px;font-weight:700}
  table.orc td{padding:8px;border-bottom:1px solid rgba(127,142,160,.18);vertical-align:top}
  table.orc .n{font-family:ui-monospace,Consolas,monospace;color:var(--muted);width:26px;text-align:center}
  table.orc .r{text-align:right;white-space:nowrap}
  table.orc .c{text-align:center}
  table.orc.fecha{margin-top:16px;border:1.5px solid var(--azul,#12294d);border-radius:10px;overflow:hidden;min-width:0}
  table.orc.fecha td{padding:10px 12px;font-size:.94rem}
  table.orc.fecha .tg td{background:#12294d;color:#fff;font-weight:800;font-size:1.05rem;border:0;letter-spacing:.04em}

  /* mídias */
  .gh{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:11px;margin:16px 0 12px}
  .gh b{font-size:.9rem;font-weight:800} .gh i{font-style:normal;font-size:.78rem;opacity:.8}
  .g-a{background:#fdecec;color:#a83232} .g-d{background:#e9f5ed;color:var(--green-d)}
  .mid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .mi{border-radius:14px;overflow:hidden;background:#0e1a26;position:relative;cursor:pointer;
    box-shadow:0 4px 14px rgba(18,33,46,.14);transition:transform .16s}
  .mi:hover{transform:translateY(-3px)}
  .mi img,.mi video{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
  .mi__c{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 10px;color:#fff;
    background:linear-gradient(transparent,rgba(6,14,28,.9))}
  .mi__l{font-weight:700;font-size:.88rem;line-height:1.25}
  .mi__d{font-size:.7rem;opacity:.75;font-family:var(--mono)}
  .mi__play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .mi__play span{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);
    display:grid;place-items:center;font-size:1.1rem;color:#12212e;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .vazio-m{color:var(--muted);font-size:.9rem;text-align:center;padding:22px 10px}

  .dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:.94rem}
  .dl dt{color:var(--muted)} .dl dd{margin:0;font-weight:600}

  .verif{background:linear-gradient(150deg,#0f2350,#123f52);color:#fff;border-radius:20px;
    padding:22px;text-align:center;margin-bottom:14px}
  .verif small{display:block;font-size:.66rem;font-weight:800;letter-spacing:.16em;
    text-transform:uppercase;opacity:.6}
  .verif b{font-family:var(--mono);font-size:1.7rem;letter-spacing:.2em;display:block;margin:6px 0 4px}
  .verif span{font-size:.8rem;opacity:.8}

  .rod{text-align:center;color:var(--muted);font-size:.82rem;padding:18px 0 0;line-height:1.7}

  /* lightbox */
  .lb{position:fixed;inset:0;background:rgba(5,12,22,.94);z-index:99;display:grid;place-items:center;
    padding:18px;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}}
  .lb img,.lb video{max-width:100%;max-height:80vh;border-radius:12px}
  .lb__l{color:#fff;text-align:center;margin-top:14px;font-weight:600}
  .lb__x{position:absolute;top:16px;right:18px;color:#fff;font-size:1.6rem;cursor:pointer;
    background:rgba(255,255,255,.12);width:42px;height:42px;border-radius:50%;display:grid;place-items:center}

  /* ===================== VERIFICAÇÃO DE AUTENTICIDADE ===================== */
  .vtela{min-height:100vh;display:grid;place-items:center;padding:26px 16px;
    background:
      repeating-linear-gradient(0deg,rgba(127,212,255,.045) 0 1px,transparent 1px 30px),
      repeating-linear-gradient(90deg,rgba(127,212,255,.045) 0 1px,transparent 1px 30px),
      radial-gradient(120% 90% at 50% 0%, var(--bp2) 0%, var(--bp) 62%)}
  .vcard{width:100%;max-width:520px;background:rgba(255,255,255,.035);
    border:1px solid rgba(127,212,255,.22);border-radius:20px;padding:30px 28px;color:#dce8f5;
    box-shadow:0 30px 80px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
  .vcard__m{display:flex;align-items:center;gap:12px;margin-bottom:22px;
    padding-bottom:18px;border-bottom:1px solid rgba(127,212,255,.16)}
  .vcard__m img{width:min(70vw,230px);height:auto}
  .vcard__m b{display:block;font-size:.95rem;line-height:1.15}
  .vcard__m small{display:block;font-size:.6rem;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;color:#6f8db0}
  .vcard h1{font-size:1.25rem;margin:0 0 6px;color:#fff;display:flex;align-items:center;gap:9px}
  .vcard p.sub{color:#8fb4d6;font-size:.9rem;margin:0 0 22px;line-height:1.5}

  .vf{display:grid;gap:15px;margin-bottom:18px}
  .vf label{display:block;font-size:.66rem;font-weight:800;letter-spacing:.14em;
    text-transform:uppercase;color:#6f8db0;margin-bottom:7px}
  .vf input{width:100%;padding:14px 15px;border:1px solid rgba(127,212,255,.28);border-radius:11px;
    font-size:1.1rem;font-weight:700;background:rgba(7,18,40,.55);color:#fff;
    font-family:var(--mono);letter-spacing:.08em}
  .vf input::placeholder{color:#4a6a8c;font-weight:500}
  .vf input:focus{outline:none;border-color:var(--linha);background:rgba(7,18,40,.8);
    box-shadow:0 0 0 4px rgba(127,212,255,.12)}
  .btn-vf{width:100%;border:none;border-radius:11px;padding:15px;font-size:.92rem;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;background:var(--linha);color:#071228;
    cursor:pointer;font-family:inherit;transition:filter .15s}
  .btn-vf:hover{filter:brightness(1.1)}
  .btn-vf[disabled]{opacity:.55;cursor:wait}

  /* o resultado chega como carimbo */
  .carimbo{margin-top:24px;text-align:center;animation:bate .5s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes bate{from{opacity:0;transform:scale(2.4) rotate(-14deg)}to{opacity:1;transform:none}}
  .carimbo__s{display:inline-flex;flex-direction:column;align-items:center;gap:2px;
    border:3px solid currentColor;border-radius:14px;padding:12px 26px;transform:rotate(-3deg)}
  .carimbo__s b{font-size:1.1rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
  .carimbo__s span{font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
  .c-sim{color:var(--ok)} .c-nao{color:#ff6b6b}
  .carimbo p{font-size:.88rem;color:#8fb4d6;margin:14px 0 0;line-height:1.5}
  .vdl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:.9rem;margin-top:22px;
    padding-top:18px;border-top:1px solid rgba(127,212,255,.16);text-align:left}
  .vdl dt{color:#6f8db0;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase}
  .vdl dd{margin:0;font-weight:700;color:#fff;font-family:var(--mono)}
  .vlink{display:block;text-align:center;margin-top:20px;padding:13px;border-radius:11px;
    border:1px solid rgba(79,224,138,.45);color:var(--ok);text-decoration:none;font-weight:800;
    font-size:.86rem;letter-spacing:.06em}
  .vlink:hover{background:rgba(79,224,138,.1)}
  .vrod{text-align:center;color:#4a6a8c;font-size:.74rem;margin-top:22px;letter-spacing:.06em}
  .carregando{text-align:center;padding:80px 20px;color:var(--muted)}

  /* ============================================================
     MOBILE — o celular é o palco principal desta página
     ============================================================ */
  /* barra que aparece ao rolar, com a aeronave e o estado sempre à mão */
  .mini{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:11px;
    padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));
    background:rgba(7,18,40,.92);backdrop-filter:blur(12px);color:#fff;
    border-bottom:1px solid rgba(127,212,255,.18);
    transform:translateY(-105%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  .mini.ver{transform:none}
  .mini img{width:min(58vw,170px);height:auto}
  .mini b{font-family:var(--mono);font-size:.95rem;letter-spacing:.03em}
  .mini span{margin-left:auto;font-size:.68rem;font-weight:800;padding:4px 11px;border-radius:999px;
    border:1px solid currentColor;white-space:nowrap}
  .mini .m-and{color:#ffd47a} .mini .m-lib{color:var(--ok)}

  @media(max-width:640px){
    .wrap{padding:0 14px 96px}
    .hero{padding-top:calc(18px + env(safe-area-inset-top))}
    .hero__in{padding:0 14px}
    .marca img{width:min(82vw,220px);height:auto}
    .id{gap:10px;margin-bottom:2px}
    .id__os{margin-left:0;text-align:left;width:100%;display:flex;align-items:baseline;gap:8px}
    .id__os small{display:inline}
    .desenho{margin:0 -14px}
    .sit{padding-bottom:22px}
    .agora{font-size:1rem}
    .trilha i{height:7px}

    .card{padding:19px 17px;border-radius:18px;margin-bottom:12px}
    .card h2{font-size:.98rem}
    .dl{grid-template-columns:1fr;gap:0}
    .dl dt{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;margin-top:11px}
    .dl dd{font-size:1rem;margin-bottom:2px}
    .dl dt:first-child{margin-top:0}

    /* galeria vira carrossel de arrastar */
    .mid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:11px;
      margin:0 -17px;padding:2px 17px 6px;scroll-padding-left:17px;
      -webkit-overflow-scrolling:touch;scrollbar-width:none}
    .mid::-webkit-scrollbar{display:none}
    .mi{flex:0 0 80%;scroll-snap-align:center}
    .mi img,.mi video{aspect-ratio:1/1}
    .gh{margin-left:0;margin-right:0}
    .arrasta{font-size:.72rem;color:var(--muted);text-align:center;margin-top:8px;
      font-family:var(--mono);letter-spacing:.06em}

    .verif{padding:20px 17px}
    .lb{padding:0}
    .lb img,.lb video{max-height:72vh;border-radius:0}
  }
  @media(min-width:641px){ .mini,.arrasta{display:none} }

  /* botão de baixar */
  .baixar{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    border:1px solid var(--line);background:#fff;border-radius:14px;padding:15px;
    font-family:inherit;font-size:.95rem;font-weight:800;color:var(--blue);cursor:pointer;
    box-shadow:0 6px 18px rgba(18,33,46,.07);margin-bottom:14px;transition:.15s}
  .baixar:hover{border-color:var(--blue);box-shadow:0 10px 26px rgba(27,63,143,.15)}
  .baixar small{display:block;font-weight:600;color:var(--muted);font-size:.76rem;margin-top:1px}
  /* no celular a ação principal fica fixa, ao alcance do polegar.
     (esta regra vem DEPOIS da de cima de propósito: senão o width:100% dela vence) */
  @media(max-width:640px){
    .baixar{position:fixed;left:14px;right:14px;width:auto;
      bottom:14px;                                    /* reserva: se o navegador não entender    */
      bottom:calc(14px + env(safe-area-inset-bottom));/* env(), a linha de cima continua valendo */
      z-index:35;margin:0;padding:16px;box-shadow:0 10px 30px rgba(18,33,46,.28)}
  }

  /* ============================================================
     IMPRESSÃO — a própria página vira o documento (mesmo conteúdo,
     sem uma segunda versão do relatório pra divergir)
     ============================================================ */
  @media print{
    @page{size:A4;margin:13mm 12mm}
    body{background:#fff;color:#12212e;font-family:Georgia,'Times New Roman',serif}
    .baixar,.lb,.mi__play,.rod{display:none!important}
    .wrap{max-width:none;padding:0}

    /* timbre */
    .hero{background:#fff!important;color:#12212e;padding:0;border-bottom:2.5px solid #12294d}
    .hero__in{padding:0}
    .marca{padding-bottom:8px;border-bottom:2px solid #12294d;margin-bottom:12px}
    .marca img{width:250px;height:auto;filter:none}
    .lg-tela{display:none!important}          /* no papel, esconde o logo branco */
    .lg-papel{display:block!important}        /* e mostra o colorido */
    .marca div{color:#12294d;font-size:13pt}
    .marca small{color:#5b6b78}
    .id__pref{font-size:26pt;color:#12212e;text-shadow:none;font-family:Consolas,monospace}
    .id__mod{color:#5b6b78}
    .id__os small{color:#5b6b78} .id__os b{color:#12294d;font-size:12pt}

    /* o desenho técnico em tinta escura */
    .desenho{margin:0;max-height:62mm;overflow:hidden}
    .dw{max-height:62mm}
    .dw .ln{stroke:#12294d!important;stroke-dashoffset:0!important;animation:none!important}
    .dw .fina{stroke:#7f97b5!important}
    .dw .eixo{stroke:#c9d3da!important}
    .dw .pin{display:none}

    .sit{padding-bottom:10px}
    .selo{border:1.5px solid #1B6E3B!important;background:#fff!important;color:#1B6E3B!important;
      padding:6px 14px;font-size:10pt}
    .selo .pt{display:none}
    .agora{color:#12212e;font-size:10pt;max-width:none}
    .trilha i{background:#dde3e9!important}
    .trilha i.on,.trilha i.fim{background:#12294d!important;transform:none!important;animation:none!important}

    'os motivos que impactam o prazo da sua aeronave.</div></div>' : '';

  /* assinaturas do serviço */
  var asn = (d.assinaturas||[]).filter(function(x){ return x.tipo!=='entrega' && x.tipo!=='retirada'; });
  var AS_TX = {6:'Liberação do planejamento', 7:'Liberação da execução', 10:'Aprovação para retorno ao serviço'};
  var asHtml = asn.length ? '<div class="card sobe" style="animation-delay:.25s">'+
    '<h2>✍️ Assinaturas<span class="c">'+asn.length+'</span></h2>'+
    asn.map(function(s){
      var alerta = s.tipo==='retirada_excepcional';
      return '<div class="sv"><div class="sv__ic'+(alerta?' esp':' ok')+'">'+(alerta?'!':'✓')+'</div>'+
        '<div><div class="sv__t">'+(alerta?'Retirada autorizada antes da conclusão'
          :esc(AS_TX[s.para_etapa]||'Assinatura'))+'</div>'+
        '<div class="sv__s">'+esc(s.nome||'—')+' · '+dtBR(s.quando)+'</div></div></div>';
    }).join('')+
    '<div class="nota">Assinaturas eletrônicas, registradas com identificação de quem assinou, '+
    'data e hora. <b>Não podem ser alteradas depois.</b></div></div>' : '';

  function grupo(t,cls,lbl,sub){
    var g=md.filter(function(m){return m.tipo===t;});
    if(!g.length) return '';
    return '<div class="gh '+cls+'"><b>'+lbl+'</b><i>'+sub+'</i></div><div class="mid">'+
      g.map(function(m,ix){
        var i = md.indexOf(m), url = PUB+m.caminho, v = m.midia==='video';
        return '<div class="mi'+(v?' mi--video':'')+'" data-i="'+i+'">'+
          (v?'<video preload="metadata" src="'+esc(url)+'#t=0.5" muted playsinline></video>'
             +'<div class="mi__play"><span>▶</span></div>'
            :'<img src="'+esc(url)+'" loading="lazy" alt="">')+
          '<div class="mi__c"><div class="mi__l">'+esc(m.legenda||'')+'</div>'+
          '<div class="mi__d">'+dataBR(m.quando)+(v?' · vídeo com som':'')+'</div></div></div>';
      }).join('')+'</div>'+
      (g.length>1 ? '<div class="arrasta">← arraste para ver as '+g.length+' →</div>' : '');
  }
  var midHtml = md.length
    ? grupo('antes','g-a','ANTES','como chegou') + grupo('depois','g-d','DEPOIS','o que foi feito')
    : '<div class="vazio-m">As fotos e vídeos do serviço aparecem aqui conforme ele avança.</div>';

  var pdAbertas = pd.filter(function(p){ return !p.resolvida_em; });
  var pdTopo = pdAbertas.length
    ? '<div class="wrap"><div class="card" style="border:1.5px solid #e6b8b8;background:#fff5f5;animation:none">'+
      '<h2 style="color:#b03030">⏳ Aguardando para seguir<span class="c">'+pdAbertas.length+'</span></h2>'+
      pdAbertas.map(function(p){ return '<div class="sv"><div class="sv__ic esp">!</div><div>'+
        '<div class="sv__t">'+esc(p.descricao)+'</div>'+(p.motivo?'<div class="sv__s">'+esc(p.motivo)+'</div>':'')+'</div></div>'; }).join('')+
      '</div></div>'
    : '';
  document.getElementById('tudo').innerHTML =
    '<div class="mini" id="mini"><img src="assets/img/pj-logo-branca.png" alt="">'+
      '<b>'+esc(a.prefixo)+'</b><span class="'+(fim?'m-lib':'m-and')+'">'+
      (fim?'Liberada':'Etapa '+o.etapa+'/10')+'</span></div>'+
    '<div class="hero"><div class="hero__in">'+
      '<div class="marca"><img class="lg-tela" src="assets/img/pj-logo-branca.png" alt="PJ AERO CENTRO">'+
        '<img class="lg-papel" src="assets/img/pj-logo.png" alt="PJ AERO CENTRO">'+
        '<div><small>Acompanhamento de serviço</small></div></div>'+
      '<div class="id"><div><div class="id__pref">'+esc(a.prefixo)+'</div>'+
        '<div class="id__mod">'+esc(a.modelo||'')+(d.proprietario?' · '+esc(d.proprietario):'')+'</div></div>'+
        '<div class="id__os"><small>Ordem de serviço</small><b>'+esc(o.codigo||'')+'</b></div></div>'+
      '<div class="desenho">'+svgAeronave(a.categoria)+'</div>'+
      '<div class="sit">'+
        '<div class="selo '+(fim?'s-lib':'s-and')+'"><span class="pt"></span>'+
          (fim?'Liberada para voltar a voar':'Em manutenção · etapa '+o.etapa+' de 10')+'</div>'+
        '<div class="agora">'+(fim
          ? 'Serviço concluído em <b>'+dataBR(o.encerrada_em)+'</b>. '+esc(ETAPA[9].d)
          : '<b>Agora:</b> '+esc(et.d))+'</div>'+
        trilha+
      '</div>'+
    '</div></div>'+
    pdTopo +

    '<div class="wrap">'+
      '<button class="baixar aparece" id="bt-baixar">📄 '+
        '<span>Baixar este relatório<small>salve em PDF ou imprima</small></span></button>'+
      '<div class="card sobe" style="animation-delay:.1s"><h2>📋 A ordem de serviço</h2>'+
        '<div style="font-weight:700;font-size:1.05rem">'+esc(o.tipo||'Serviço')+'</div>'+
        (o.descricao?'<div class="sv__s" style="margin-top:2px;margin-bottom:14px">'+esc(o.descricao)+'</div>':'')+
        '<dl class="dl">'+
          '<dt>Matrícula</dt><dd>'+esc(a.prefixo)+'</dd>'+
          '<dt>Modelo</dt><dd>'+esc(a.modelo||'—')+'</dd>'+
          (a.numero_serie?'<dt>Nº de série</dt><dd>'+esc(a.numero_serie)+'</dd>':'')+
          '<dt>Proprietário</dt><dd>'+esc(d.proprietario||'—')+'</dd>'+
          (d.operador && d.operador!==d.proprietario?'<dt>Operador</dt><dd>'+esc(d.operador)+'</dd>':'')+
          '<dt>Entrada na oficina</dt><dd>'+dataBR(o.aberta_em)+'</dd>'+
          '<dt>'+(fim?'Retorno ao serviço':'Situação')+'</dt><dd>'+
            (fim?dataBR(o.encerrada_em):'em manutenção')+'</dd>'+
          '<dt>Permanência</dt><dd>'+(o.dias||1)+' dia(s)</dd>'+
        '</dl></div>'+

      '<div class="card sobe" style="animation-delay:.16s"><h2>🔧 Serviços<span class="c">'+sv.length+'</span></h2>'+
        svHtml+'<div class="nota">Na PJ AERO CENTRO, todos os serviços passam por <b>inspeção final de conformidade '+
        'realizada por um segundo profissional habilitado</b> — a dupla inspeção — antes da aprovação para '+
        'retorno ao serviço, em conformidade com as boas práticas de manutenção aeronáutica.</div></div>'+

      fbHtml+
      pdHtml+
      orcHtml+
      anxHtml+

      '<div class="card sobe" style="animation-delay:.22s"><h2>🎞️ Registro do serviço</h2>'+midHtml+'</div>'+

      asHtml+

      '<div class="card sobe" style="animation-delay:.28s"><h2>🛬 Entrada e saída</h2><dl class="dl">'+
        '<dt>Entregue por</dt><dd>'+esc(o.entrega_nome||'—')+
          (o.entrega_doc||o.entrega_anac?'<br><span class="sv__s">'+esc(o.entrega_doc||'')+
            (o.entrega_anac?' · ANAC '+esc(o.entrega_anac):'')+'</span>':'')+
          (o.entrega_em?'<br><span class="sv__s">'+dtBR(o.entrega_em)+'</span>':'')+'</dd>'+
        '<dt>Retirada por</dt><dd>'+esc(o.retirada_nome||'ainda na oficina')+
          (o.retirada_doc||o.retirada_anac?'<br><span class="sv__s">'+esc(o.retirada_doc||'')+
            (o.retirada_anac?' · ANAC '+esc(o.retirada_anac):'')+'</span>':'')+
          (o.retirada_em?'<br><span class="sv__s">'+dtBR(o.retirada_em)+'</span>':'')+'</dd>'+
      '</dl></div>'+

      '<div class="verif sobe" style="animation-delay:.34s"><small>Código de autenticidade</small>'+
        '<b>'+esc(o.verificacao||'—')+'</b>'+
        '<span>Confirme este documento em '+location.host+'/verificar</span></div>'+

      '<div class="rod"><b>PJ AERO CENTRO</b> · Cerejeiras–RO<br>'+
        'Qualquer dúvida sobre o serviço, fale com a gente.</div>'+
      '<div class="so-papel" id="bloco-qr"></div>'+
      '<div class="impresso"><b>PJ AERO CENTRO</b> · Cerejeiras–RO<br>'+
        'Documento emitido em '+dtBR(new Date().toISOString())+' · '+esc(o.codigo||'')+' · '+esc(a.prefixo)+
        '<br>Confira a autenticidade em '+location.host+'/verificar</div>'+
    '</div>';

  /* QR só faz sentido no papel: na tela a pessoa já está no link */
  (function(){
    var alvo = document.getElementById('bloco-qr'), tk = pegaToken();
    if(!alvo || !tk || typeof QR === 'undefined') return;
    var url = location.origin + '/os/' + tk;
    var qr = QR.dataURI(url, 150);
    if(!qr) return;
    var temVideo = md.some(function(m){ return m.midia === 'video'; });
    alvo.innerHTML =
      '<img class="qr-img" src="'+qr+'" alt="QR">'+
      '<div class="qr-tx"><b>Este relatório continua online</b>'+
        '<p>Aponte a câmera do celular para o código — lá as fotos ficam em tamanho real'+
        (temVideo?' e os <b>vídeos podem ser ouvidos</b>':'')+
        ', e a página acompanha o serviço em tempo real.</p>'+
        '<span class="qr-url">'+esc(url)+'</span>'+
        (o.verificacao?'<div class="qr-cod">Código de autenticidade <b>'+esc(o.verificacao)+'</b></div>':'')+
      '</div>';
  })();

  medir();
  enquadra();                     /* no celular, aproxima o avião pra ele dominar a tela */
  window.addEventListener('resize', enquadra);

  /* a barra do topo entra quando o cabeçalho sai de vista.
     Observador em vez de escutar rolagem: não roda a cada pixel e é mais confiável. */
  var mini = document.getElementById('mini'), sit = document.querySelector('.sit');
  if(sit){
    var mostra = function(){ mini.classList.toggle('ver', sit.getBoundingClientRect().bottom < 0); };
    /* os dois caminhos de propósito: o observador é eficiente, mas o ouvinte de rolagem
       garante o comportamento onde o observador for limitado ou ficar em silêncio */
    if('IntersectionObserver' in window){
      new IntersectionObserver(function(e){
        mini.classList.toggle('ver', !e[0].isIntersecting);
      }, {threshold:0}).observe(sit);
    }
    window.addEventListener('scroll', mostra, {passive:true});
    mostra();
  }

  document.getElementById('bt-baixar').onclick = function(){
    /* garante que o desenho apareça pronto no papel (a animação não roda na impressão) */
    document.querySelectorAll('.dw .ln').forEach(function(el){ el.style.strokeDashoffset = '0'; });
    setTimeout(function(){
      /* Alguns celulares — e páginas abertas dentro de apps (WhatsApp, Gmail,
         Instagram) — ignoram o pedido de impressão sem avisar. Se a impressão
         não começar, explicamos ao cliente como salvar, em vez de não fazer nada. */
      var iniciou = false;
      function marca(){ iniciou = true; }
      window.addEventListener('beforeprint', marca);
      var mq = window.matchMedia ? window.matchMedia('print') : null;
      if(mq && mq.addListener) mq.addListener(marca);

      try{ window.print(); }catch(e){ /* segue para a ajuda abaixo */ }

      setTimeout(function(){
        window.removeEventListener('beforeprint', marca);
        if(mq && mq.removeListener) mq.removeListener(marca);
        if(!iniciou) ajudaSalvar();
      }, 900);
    }, 120);
  };

  /* Explica como salvar quando o navegador do celular não abre a impressão */
  function ajudaSalvar(){
    if(document.getElementById('ov-salvar')) return;
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
    var passos = ios
      ? 'Toque em <b>Compartilhar</b> (o quadrado com a seta) e escolha <b>Imprimir</b> — depois <b>Salvar em PDF</b>.'
      : 'Toque no menu <b>⋮</b> do navegador e escolha <b>Imprimir</b> ou <b>Compartilhar → Imprimir</b> — depois <b>Salvar como PDF</b>.';
    var dentroApp = /FBAN|FBAV|Instagram|WhatsApp|Line\//i.test(navigator.userAgent);
    var ov = document.createElement('div');
    ov.id = 'ov-salvar';
    ov.style.cssText = 'position:fixed;inset:0;z-index:9800;background:rgba(4,10,22,.86);display:grid;place-items:center;padding:18px';
    ov.innerHTML =
      '<div style="background:#0b1e42;border:1px solid rgba(127,212,255,.22);border-radius:14px;max-width:400px;width:100%;padding:20px;color:#e6eef7;font-family:inherit;line-height:1.55">'+
        '<h3 style="margin:0 0 8px;font-size:1.05rem">Como salvar este relatório</h3>'+
        (dentroApp
          ? '<p style="margin:0 0 12px;color:#8fb4d6;font-size:.88rem">Você abriu por dentro de outro aplicativo, e ele não deixa salvar. Toque em <b>Abrir no navegador</b> (menu ⋮) e tente de novo.</p>'
          : '<p style="margin:0 0 12px;color:#8fb4d6;font-size:.88rem">Seu celular não abriu a janela de impressão. Faça assim:</p>')+
        '<p style="margin:0 0 14px;font-size:.9rem">'+passos+'</p>'+
        '<p style="margin:0 0 14px;color:#8fb4d6;font-size:.82rem">Prefere no computador? Copie o endereço desta página e abra por lá.</p>'+
        '<div style="display:flex;gap:8px">'+
          '<button id="ovs-copiar" style="flex:1;border:0;border-radius:9px;padding:11px;background:#12294d;color:#fff;font-weight:700;cursor:pointer">Copiar o link</button>'+
          '<button id="ovs-fechar" style="border:0;border-radius:9px;padding:11px 14px;background:#26364a;color:#fff;cursor:pointer">Fechar</button>'+
        '</div>'+
      '</div>';
    document.body.appendChild(ov);
    document.getElementById('ovs-fechar').onclick = function(){ ov.remove(); };
    document.getElementById('ovs-copiar').onclick = function(){
      var b = this;
      try{ navigator.clipboard.writeText(location.href); b.textContent = 'Link copiado ✓'; }
      catch(e){ b.textContent = location.href; }
    };
  }
  if(fim) setTimeout(function(){ document.querySelector('.hero').classList.add('vivo'); }, 2300);
  document.querySelectorAll('.mi').forEach(function(el){
    el.onclick = function(){ lightbox(MID[+el.dataset.i]); };
  });
}

function lightbox(m){
  if(!m) return;
  var url = PUB+m.caminho;
  var d = document.createElement('div');
  d.className='lb';
  d.innerHTML = '<div class="lb__x">×</div><div>'+
    (m.midia==='video'
      ? '<video controls autoplay playsinline src="'+esc(url)+'"></video>'
      : '<img src="'+esc(url)+'">')+
    '<div class="lb__l">'+esc(m.legenda||'')+'</div></div>';
  document.body.appendChild(d);
  d.onclick = function(e){ if(e.target===d || e.target.className==='lb__x') d.remove(); };
}

/* ---------------- /verificar ---------------- */
function telaVerificar(){
  document.getElementById('tudo').innerHTML =
    '<div class="vtela"><div><div class="vcard sobe">'+
      '<div class="vcard__m"><img src="assets/img/pj-logo-branca.png" alt="PJ AERO CENTRO">'+
        '<div><small>Cerejeiras–RO</small></div></div>'+
      '<h1>🔒 Verificação de autenticidade</h1>'+
      '<p class="sub">Recebeu um relatório de serviço com o nosso nome? Confirme aqui se ele foi '+
      'mesmo emitido por nós. Os dois dados estão impressos no rodapé do documento.</p>'+
      '<div class="vf">'+
        '<div><label>Nº da ordem de serviço</label>'+
          '<input id="v-os" placeholder="OS 2026-0007" autocomplete="off" inputmode="text"></div>'+
        '<div><label>Código de autenticidade</label>'+
          '<input id="v-cod" placeholder="A3F9C1" maxlength="10" autocomplete="off" '+
          'style="text-transform:uppercase"></div>'+
      '</div>'+
      '<button class="btn-vf" id="v-bt">Verificar documento</button>'+
      '<div id="v-res"></div>'+
      '<div class="vrod">Consulta pública · nenhum dado é armazenado</div>'+
    '</div></div></div>';

  var bt=document.getElementById('v-bt');
  [document.getElementById('v-os'),document.getElementById('v-cod')].forEach(function(c){
    c.addEventListener('keydown',function(e){ if(e.key==='Enter') bt.click(); });
  });
  bt.onclick = async function(){
    var os=document.getElementById('v-os').value.trim(), cod=document.getElementById('v-cod').value.trim();
    var res=document.getElementById('v-res');
    if(!os||!cod){
      res.innerHTML='<div class="carimbo"><div class="carimbo__s c-nao"><b>Faltam dados</b>'+
        '<span>preencha os dois campos</span></div></div>'; return; }
    bt.disabled=true; bt.textContent='Verificando…'; res.innerHTML='';
    var r = await sb.rpc('os_verifica',{p_codigo:os,p_verificacao:cod});
    bt.disabled=false; bt.textContent='Verificar documento';
    var d=r.data;
    if(r.error||!d){
      res.innerHTML='<div class="carimbo"><div class="carimbo__s c-nao"><b>Não confere</b>'+
        '<span>documento não localizado</span></div>'+
        '<p>Não encontramos um documento com esse número e código. Confira se digitou exatamente '+
        'como está impresso — ou fale com a oficina.</p></div>'; return;
    }
    res.innerHTML='<div class="carimbo"><div class="carimbo__s c-sim"><b>Documento autêntico</b>'+
        '<span>emitido pela PJ AERO CENTRO</span></div></div>'+
      '<dl class="vdl">'+
        '<dt>Ordem de serviço</dt><dd>'+esc(d.codigo||'—')+'</dd>'+
        '<dt>Aeronave</dt><dd>'+esc(d.prefixo||'—')+'</dd>'+
        (d.modelo?'<dt>Modelo</dt><dd>'+esc(d.modelo)+'</dd>':'')+
        '<dt>Entrada</dt><dd>'+dataBR(d.aberta_em)+'</dd>'+
        '<dt>Situação</dt><dd>'+(d.encerrada_em?'Liberada '+dataBR(d.encerrada_em):'Em manutenção')+'</dd>'+
      '</dl>'+
      (d.token?'<a class="vlink" href="/os/'+esc(d.token)+'">Ver o serviço completo →</a>':'');
  };
}
carrega();
</script>
